<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parking Rate Calculator</title>
</head>
<body>
    <h1>Parking Rate Calculator</h1>

    <input type="text"id="hours"placeholder="How many hours?"/>

    <br>

    <label>
        Are you parking on a weekend? <input type="checkbox"id="weekend"/>
    </label>

    <br>

    <button id="calcButton">Calculate</button>

    <h2>Total Cost</h2>
    <p id="parkingFees">Parking Fees: $0.00 </p>
    <p id="tax">Tax: $0.00 </p>
    <p id="total">Total: $.000 </p>

    <script src="app.js"></script>
</body>
</html>
